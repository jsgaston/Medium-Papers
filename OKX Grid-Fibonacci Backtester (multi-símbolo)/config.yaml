# =========================================================
# Configuración del backtester multi-símbolo para OKX
# =========================================================

exchange:
  base_url: "https://www.okx.com"
  # OKX limita /market/candles y /market/history-candles a ~20 req / 2s por IP.
  # Dejamos margen de seguridad.
  requests_per_second: 5

# Instrumentos a descargar y testear. Usa el formato instId de OKX (BASE-QUOTE).
# Cuantos más símbolos, más robusto el grid search (menos overfitting a un solo activo).
symbols:
  - BTC-USDT
  - ETH-USDT
  - SOL-USDT
  - XRP-USDT
  - DOGE-USDT
  - ADA-USDT
  - AVAX-USDT
  - LINK-USDT
  - LTC-USDT
  - POL-USDT     # antes MATIC-USDT: Polygon rebrandeó MATIC -> POL en 2024
  - BNB-USDT
  - GRAM-USDT    # antes TON-USDT: OKX delistó TON y migró a GRAM (1:1) en junio 2026

# Timeframe de las velas (bar) para el backtest.
# Opciones OKX: 1m,3m,5m,15m,30m,1H,2H,4H,6H,12H,1D,1W,1M
timeframe: "15m"

# Días de histórico a descargar hacia atrás
history_days: 730

data_dir: "data/ohlcv"
orderbook_dir: "data/orderbook_snapshots"
results_dir: "results"

# Comisiones aproximadas spot de OKX (revisa tu nivel VIP real en tu cuenta,
# esto afecta directamente a la rentabilidad simulada)
fees:
  maker: 0.0008   # 0.08%
  taker: 0.001    # 0.10%

# Slippage estimado aplicado a cada fill simulado (en puntos básicos)
backtest:
  initial_capital_usdt: 10000
  slippage_bps: 2

# Espacio de búsqueda del grid search (estrategia grid-fibonacci de liquidez)
strategy:
  base_order_size_pct: 0.02          # % del capital destinado a la orden base (nivel 1)
  num_levels_grid: [2, 3, 4, 5]
  price_deviation_multiplier_grid: [0.5, 1.0, 1.5, 2.0]
  size_scaling_factor_grid: [0.0, 0.15, 0.3, 0.5]
  # Si el precio se aleja más allá del nivel más externo * este factor, se re-centra el grid
  regrid_threshold_grid: [0.618, 1.0]

# Recolector de order book en tiempo real (opcional, para construir tu propio
# histórico de profundidad ya que OKX no da L2 histórico gratis más allá de unos meses)
orderbook_collector:
  channel: "books5"     # books5 = 5 niveles bid/ask, ligero y suficiente para depth
  snapshot_every_sec: 5 # cada cuántos segundos guardamos un snapshot (evita saturar disco)
